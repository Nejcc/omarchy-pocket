# tmux for pocket terminals (pocket.lua): only here for the command bar at
# the bottom. Each tab is its own session; closing the tab kills it.
set -g destroy-unattached on
set -g mouse on
set -g escape-time 0
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

set -g status-position bottom
set -g status-justify centre
set -g status-style "bg=default,fg=brightblack"
set -g status-left ""
set -g status-right ""
set -g window-status-format ""
set -g window-status-current-format "#[fg=blue,bold]Super+M#[default] hide   #[fg=blue,bold]Super+Ctrl+M#[default] new tab   #[fg=blue,bold]Super+Ctrl+←/→#[default] switch   #[fg=blue,bold]Super+Alt+1-9#[default] jump   #[fg=blue,bold]Super+Shift+M#[default] pocket window"

# Tab titles in the Hyprland group bar: running command and folder.
set -g set-titles on
set -g set-titles-string "#{pane_current_command} · #{b:pane_current_path}"
